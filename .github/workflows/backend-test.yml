name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'lib/**'
      - '__tests__/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.mocharc.json'
      - 'tsconfig.json'
      - 'scripts/**'
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      # tsc -b on the root tsconfig builds the referenced lib/ project too,
      # so no separate build:lib step is needed here.
      - name: Type-check backend
        run: npm run tsc

  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0.23
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build:lib

      - name: Wait for MongoDB
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB is ready"

      - name: Set test environment variables
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "DB_URI=mongodb://localhost:27017/blueprintnotincluded_test" >> $GITHUB_ENV
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> $GITHUB_ENV

      - name: Run backend tests
        run: npm run test
