name: Build and Deploy

on:
  push:
    branches:
      - "master"

jobs:
  quick-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc -b on the root tsconfig builds the referenced lib/ project too.
      - name: Compile TypeScript
        run: npm run tsc

  deploy:
    runs-on: ubuntu-latest
    needs: quick-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Compute build metadata
        run: |
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      # type=gha is the right cache backend again now that the job runs on a
      # GitHub-hosted runner. It was previously swapped for a Blacksmith
      # sticky disk because from a Blacksmith runner the GHA cache is a
      # cross-provider transfer: mode=max's ~400MB node_modules blobs pinned
      # the repo cache at its 10GB cap and evictions re-downloaded them at
      # <1MB/s (30+ min builds). Same-provider that transfer is local and fast,
      # so mode=max pays off across the three npm ci stages in deploy.Dockerfile.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy.Dockerfile
          tags: bni-deploy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
        
      - name: Smoke test preview renderer
        # Renders a fixture blueprint inside the deploy image under a
        # prod-like memory cap: catches missing native bindings (canvas),
        # broken asset layout and memory regressions before the push.
        run: |
          docker run --rm --memory=512m --memory-swap=512m bni-deploy \
            node app/api/services/preview-render-worker.js --smoke

      - name: Verify version information
        run: |
          echo "Verifying version information in built image..."
          docker run --rm bni-deploy node -e "
            console.log('Testing version controller...');
            try {
              // Test that the version controller can be loaded
              const fs = require('fs');
              const path = require('path');
              
              // Check if package.json exists in the expected location
              const packagePath = path.join('..', 'package.json');
              if (fs.existsSync(packagePath)) {
                const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
                console.log('✓ Package version:', packageJson.version);
              } else {
                console.log('⚠ Package.json not found at expected location');
              }
              
              // Check environment variables
              console.log('✓ Build date:', process.env.BUILD_DATE || 'not set');
              console.log('✓ Git commit:', process.env.GIT_COMMIT || 'not set');
              console.log('✓ Git branch:', process.env.GIT_BRANCH || 'not set');
              console.log('✓ Environment:', process.env.ENV_NAME || 'production');
              
              console.log('✓ Version verification completed successfully');
            } catch (error) {
              console.error('✗ Version verification failed:', error.message);
              process.exit(1);
            }
          "
        
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600
        
      - name: Tag image
        run: docker tag bni-deploy ${{ vars.DIGITALOCEAN_REGISTRY }}/${{ vars.IMAGE_NAME }}
        
      - name: Push image to DO Container Registry
        run: docker push ${{ vars.DIGITALOCEAN_REGISTRY }}/${{ vars.IMAGE_NAME }}
