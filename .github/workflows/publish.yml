name: Build and Deploy

on:
  push:
    branches:
      - "master"

# checkout reads the repo; the build job also pushes the image to ghcr.io
# with GITHUB_TOKEN (packages: write is granted on that job alone).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  quick-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc -b on the root tsconfig builds the referenced lib/ project too.
      - name: Compile TypeScript
        run: npm run tsc

  build:
    runs-on: ubuntu-latest
    needs: quick-check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Compute build metadata
        run: |
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      # type=gha is the right cache backend again now that the job runs on a
      # GitHub-hosted runner. It was previously swapped for a Blacksmith
      # sticky disk because from a Blacksmith runner the GHA cache is a
      # cross-provider transfer: mode=max's ~400MB node_modules blobs pinned
      # the repo cache at its 10GB cap and evictions re-downloaded them at
      # <1MB/s (30+ min builds). Same-provider that transfer is local and fast,
      # so mode=max pays off across the three npm ci stages in deploy.Dockerfile.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy.Dockerfile
          tags: bni-deploy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Links the ghcr.io package to this repository (it then inherits the
          # repo's access permissions; visibility is set once by hand).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.GIT_COMMIT }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
        
      - name: Smoke test preview renderer
        # Renders a fixture blueprint inside the deploy image under a
        # prod-like memory cap: catches missing native bindings (canvas),
        # broken asset layout and memory regressions before the push.
        run: |
          docker run --rm --memory=512m --memory-swap=512m bni-deploy \
            node app/api/services/preview-render-worker.js --smoke

      - name: Verify version information
        run: |
          echo "Verifying version information in built image..."
          docker run --rm bni-deploy node -e "
            console.log('Testing version controller...');
            try {
              // Test that the version controller can be loaded
              const fs = require('fs');
              const path = require('path');
              
              // Check if package.json exists in the expected location
              const packagePath = path.join('..', 'package.json');
              if (fs.existsSync(packagePath)) {
                const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
                console.log('✓ Package version:', packageJson.version);
              } else {
                console.log('⚠ Package.json not found at expected location');
              }
              
              // Check environment variables
              console.log('✓ Build date:', process.env.BUILD_DATE || 'not set');
              console.log('✓ Git commit:', process.env.GIT_COMMIT || 'not set');
              console.log('✓ Git branch:', process.env.GIT_BRANCH || 'not set');
              console.log('✓ Environment:', process.env.ENV_NAME || 'production');
              
              console.log('✓ Version verification completed successfully');
            } catch (error) {
              console.error('✗ Version verification failed:', error.message);
              process.exit(1);
            }
          "
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is staging's image. Production is promoted from it by the
      # "Promote to production" workflow, which names the manifest :prod.
      # :sha-<short> keeps every build addressable for a manual rollback or
      # a bisect; ghcr.io charges nothing for a public repository's packages,
      # so nothing garbage-collects them.
      - name: Push image to ghcr.io
        run: |
          short=${GIT_COMMIT::7}
          docker tag bni-deploy "$IMAGE:latest"
          docker tag bni-deploy "$IMAGE:sha-$short"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$short"
          echo "Pushed \`$IMAGE:latest\` and \`$IMAGE:sha-$short\`" >> "$GITHUB_STEP_SUMMARY"

  # Staging follows :latest on the Hetzner box. The box only accepts SSH, so
  # the deploy is a copy of deploy/ plus one script run; deploy/README.md
  # describes the layout it lands in and the secrets/variables it needs
  # (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS).
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.blueprintnotincluded.org
    # One deploy at a time per project: two overlapping `compose up`s could
    # race each other's pull.
    concurrency: deploy-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync deploy/ to the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            deploy/ "deploy@$DEPLOY_HOST:/srv/bpni/deploy/"

      - name: Deploy staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@$DEPLOY_HOST" \
            /srv/bpni/deploy/bin/deploy.sh staging
