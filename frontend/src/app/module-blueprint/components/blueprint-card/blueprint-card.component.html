<article
  *ngIf="isReal(item.thumbnail)"
  class="blueprint-card bni-card"
  [class.bni-card--draft]="item.isPublished === false"
>
  <a
    class="bni-card__thumb"
    [routerLink]="['/blueprint', item.id]"
    [state]="linkState"
  >
    <img
      [appQueuedPreview]="cardPreviewUrl()"
      [previewFallback]="item.thumbnail"
      [alt]="item.name"
      width="480"
      height="480"
    />
  </a>

  <div class="card-info">
    <div class="card-title-row">
      <a
        class="bni-card__title"
        [routerLink]="['/blueprint', item.id]"
        [state]="linkState"
        >{{ item.name }}</a
      >
      <app-star-rating
        class="card-stars"
        [nbLikes]="item.nbLikes"
        [showCount]="false"
      ></app-star-rating>
    </div>
    <div class="card-meta">
      <span *ngIf="showOwner" i18n
        >by
        <a class="card-owner" [routerLink]="['/profile', item.ownerName]">{{
          item.ownerName
        }}</a></span
      >
      <span class="card-date">{{ item.createdAt | date: "yyyy-MM-dd" }}</span>
    </div>
    <div class="card-badges">
      <span
        *ngIf="item.isPublished === false"
        class="bni-chip bni-chip--draft"
        i18n-title
        title="Only you (and admins) can see this blueprint"
        i18n
        >Draft</span
      >
      <a
        *ngIf="item.category"
        class="bni-chip bni-chip--cat"
        [routerLink]="['/discover']"
        [queryParams]="{ category: item.category }"
        [title]="categoryTooltip(item.category)"
        >{{ item.category }}</a
      >
      <span *ngIf="!item.category" class="bni-chip bni-chip--untagged" i18n
        >Untagged</span
      >
      <a
        *ngIf="item.gameVersion"
        class="bni-chip"
        [routerLink]="['/discover']"
        [queryParams]="{ gameVersion: item.gameVersion }"
        [title]="gameVersionTooltip(item.gameVersion)"
        >{{ item.gameVersion }}</a
      >
      <a
        *ngIf="item.modded"
        class="bni-chip bni-chip--modded"
        [routerLink]="['/discover']"
        [queryParams]="{ modded: 'true' }"
        [title]="moddedTooltip()"
        i18n
        >Modded</a
      >
      <a
        *ngFor="let room of visibleRooms"
        class="bni-chip bni-chip--room"
        [routerLink]="['/discover']"
        [queryParams]="{ rooms: room }"
        [title]="roomTooltip(roomTypeLabel(room))"
        >{{ roomTypeLabel(room) }}</a
      >
      <span
        *ngIf="hiddenRoomCount > 0"
        class="bni-chip bni-chip--room bni-chip--room-more"
        [title]="hiddenRoomsTitle"
        >+{{ hiddenRoomCount }}</span
      >
    </div>
    <div class="card-social">
      <app-like-widget
        class="card-likes"
        [blueprintId]="item.id"
        [nbLikes]="item.nbLikes"
        [likedByMe]="item.likedByMe"
        [disabled]="!loggedIn"
      ></app-like-widget>
      <a
        class="card-comments bni-icon-link"
        [routerLink]="['/blueprint', item.id]"
        fragment="comments"
        [state]="linkState"
        i18n-title
        title="View comments"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21 12c0 4-4 7-9 7-1 0-2-.1-2.9-.4L4 20l1.2-3.2C3.8 15.5 3 13.8 3 12c0-4 4-7 9-7s9 3 9 7z"
          ></path>
        </svg>
        {{ item.commentCount }}
      </a>
      <a
        class="card-forks bni-icon-link"
        [routerLink]="['/blueprint', item.id]"
        [state]="linkState"
        i18n-title
        title="Fork count"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="6" cy="5" r="2.6"></circle>
          <circle cx="18" cy="5" r="2.6"></circle>
          <circle cx="12" cy="19" r="2.6"></circle>
          <path d="M6 8v2c0 2 1.5 3 3.5 3h5c2 0 3.5-1 3.5-3V8M12 13v3"></path>
        </svg>
        {{ item.nbForks }}
      </a>
      <span class="card-views bni-icon-link" i18n-title title="View count">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path
            d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"
          ></path>
          <circle cx="12" cy="12" r="2.8"></circle>
        </svg>
        {{ item.nbViews }}
      </span>
      <span
        class="card-downloads bni-icon-link"
        i18n-title
        title="Download count"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M4 17v2.5h16V17"></path>
        </svg>
        {{ item.nbDownloads }}
      </span>
    </div>
  </div>
</article>

<div
  *ngIf="item.thumbnail === 'svg'"
  class="blueprint-card bni-card bni-skel"
  aria-hidden="true"
>
  <div class="bni-card__thumb">
    <svg
      width="34"
      height="34"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    >
      <path
        d="M7 3h10M7 21h10M8 3c0 4 8 5 8 9s-8 5-8 9M16 3c0 4-8 5-8 9s8 5 8 9"
      ></path>
    </svg>
  </div>
  <div class="card-info skel-info">
    <div class="bni-skel__bar"></div>
    <div class="bni-skel__bar bni-skel__bar--dim"></div>
    <div class="skel-chips">
      <div class="bni-skel__chip"></div>
      <div class="bni-skel__chip skel-chip--narrow"></div>
    </div>
  </div>
</div>

<div
  *ngIf="item.thumbnail === 'svg_nothing'"
  class="blueprint-card bni-card no-results-card"
>
  <div class="bni-card__thumb no-results-thumb">
    <svg
      width="34"
      height="34"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M6 6l12 12"></path>
    </svg>
  </div>
  <div class="card-info">
    <span class="bni-card__title">{{ item.name }}</span>
  </div>
</div>
