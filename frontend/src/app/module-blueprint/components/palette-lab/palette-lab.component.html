<div class="palette-lab" *ngIf="enabled" [class.collapsed]="!open">
  <button
    type="button"
    class="palette-lab__handle"
    (click)="open = !open"
    [attr.aria-expanded]="open"
  >
    <span class="palette-lab__handle-dots" aria-hidden="true">
      <i [style.background]="paletteById(current).swatch[0]"></i>
      <i [style.background]="paletteById(current).swatch[1]"></i>
      <i [style.background]="paletteById(current).swatch[2]"></i>
    </span>
    Palette
  </button>

  <div class="palette-lab__body" *ngIf="open">
    <p class="palette-lab__hint">
      Dev only. Pick one and the whole skin re-tokenises live.
    </p>
    <button
      *ngFor="let p of palettes"
      type="button"
      class="palette-lab__option"
      [class.active]="current === p.id"
      (click)="select(p.id)"
    >
      <span class="palette-lab__swatch" aria-hidden="true">
        <i [style.background]="p.swatch[0]"></i>
        <i [style.background]="p.swatch[1]"></i>
        <i [style.background]="p.swatch[2]"></i>
      </span>
      <span class="palette-lab__text">
        <span class="palette-lab__name">{{ p.label }}</span>
        <span class="palette-lab__note">{{ p.note }}</span>
      </span>
    </button>
  </div>
</div>
