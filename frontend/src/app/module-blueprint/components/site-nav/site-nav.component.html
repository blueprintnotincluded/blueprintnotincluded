<p-menubar>
  <ng-template pTemplate="start">
    <a
      routerLink="/discover"
      class="bni-nav-logo"
      aria-label="Blueprint Not Included"
    >
      <img
        class="bni-nav-mark"
        src="assets/images/ui/manual/logo.png"
        alt=""
        width="32"
        height="32"
      />
      <span class="bni-nav-wordmark"
        >BLUEPRINT <em class="bni-nav-not">NOT</em> INCLUDED</span
      >
    </a>
  </ng-template>
  <ng-template pTemplate="end">
    <app-notification-bell
      *ngIf="authService.isLoggedIn()"
    ></app-notification-bell>
    <app-user-menu
      [myBlueprintsEnabled]="false"
      (about)="about.emit()"
      (sendFeedback)="sendFeedback.emit()"
    ></app-user-menu>
  </ng-template>
</p-menubar>
