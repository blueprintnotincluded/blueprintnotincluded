<button
  type="button"
  class="toolbar-button"
  [class.active]="active"
  [disabled]="disabled"
  [pTooltip]="label"
  tooltipPosition="left"
  tooltipEvent="both"
  (click)="buttonClick.emit()"
>
  <img
    class="toolbar-button-background"
    src="assets/images/toolbar-background.png"
    alt=""
  />
  <img class="toolbar-button-icon" [src]="iconUrl" [alt]="label" />
</button>
