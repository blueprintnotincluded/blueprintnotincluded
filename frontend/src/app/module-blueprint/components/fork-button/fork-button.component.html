<button
  type="button"
  class="bni-btn"
  [pTooltip]="disabled ? forkTitle : ''"
  [title]="disabled ? '' : forkTitle"
  [disabled]="disabled || forking"
  (click)="fork()"
>
  <svg
    width="13"
    height="13"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <circle cx="6" cy="5" r="2.6"></circle>
    <circle cx="18" cy="5" r="2.6"></circle>
    <circle cx="12" cy="19" r="2.6"></circle>
    <path d="M6 8v2c0 2 1.5 3 3.5 3h5c2 0 3.5-1 3.5-3V8M12 13v3"></path>
  </svg>
  <ng-container i18n>Fork</ng-container>
</button>
