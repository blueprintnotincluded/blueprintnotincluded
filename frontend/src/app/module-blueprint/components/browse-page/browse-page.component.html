<div class="bni-skin bni-page">
  <p-toast position="top-center" [style]="{ marginTop: '40px' }"></p-toast>

  <app-site-nav
    (about)="aboutDialog.toggleDialog()"
    (sendFeedback)="feedbackDialog.open()"
    (myBlueprintsRequested)="showMyBlueprints($event)"
  ></app-site-nav>

  <app-dialog-about #aboutDialog></app-dialog-about>
  <app-feedback-dialog #feedbackDialog></app-feedback-dialog>

  <div class="browse-page">
    <div class="browse-header">
      <h1 i18n>Browse Blueprints</h1>
      <div class="search-box">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="M15.5 15.5L21 21"></path>
        </svg>
        <input
          class="search-input"
          type="text"
          i18n-placeholder
          placeholder="Search blueprints"
          [(ngModel)]="filterName"
          (ngModelChange)="filterNameSubject.next($event)"
          pInputText
        />
      </div>
    </div>

    <div class="view-mode-tabs bni-seg" *ngIf="loggedIn && followingCount > 0">
      <button
        type="button"
        [class.active]="viewMode === 'discover'"
        [attr.aria-pressed]="viewMode === 'discover'"
        (click)="setViewMode('discover')"
        i18n
      >
        Discover
      </button>
      <button
        type="button"
        [class.active]="viewMode === 'feed'"
        [attr.aria-pressed]="viewMode === 'feed'"
        (click)="setViewMode('feed')"
        i18n
      >
        From creators you follow
      </button>
    </div>

    <div class="filter-panel" *ngIf="viewMode === 'discover'">
      <p-select
        [(ngModel)]="filterGameVersion"
        [options]="gameVersionOptions"
        optionLabel="label"
        optionValue="value"
        [showClear]="false"
        (onChange)="onFacetChange()"
        i18n-placeholder
        placeholder="Version"
      ></p-select>
      <p-select
        [(ngModel)]="filterCategory"
        [options]="categoryOptions"
        optionLabel="label"
        optionValue="value"
        [showClear]="false"
        (onChange)="onFacetChange()"
        i18n-placeholder
        placeholder="Category"
      ></p-select>
      <p-select
        [(ngModel)]="sort"
        [options]="sortOptions"
        optionLabel="label"
        optionValue="value"
        [showClear]="false"
        (onChange)="onSortChange()"
        i18n-placeholder
        placeholder="Sort"
      ></p-select>
      <p-select
        *ngIf="subcategoryOptions.length > 0"
        [(ngModel)]="filterSubcategory"
        [options]="subcategoryOptions"
        optionLabel="label"
        optionValue="value"
        [showClear]="false"
        (onChange)="onSubcategoryChange()"
        i18n-placeholder
        placeholder="Subcategory"
      ></p-select>
      <button
        *ngIf="
          filterGameVersion || filterCategory || filterSubcategory || filterName
        "
        type="button"
        class="clear-filters"
        (click)="clearFilters()"
      >
        <svg
          width="11"
          height="11"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M5 5l14 14M19 5L5 19"></path>
        </svg>
        <ng-container i18n>Clear filters</ng-container>
      </button>
    </div>

    <div *ngIf="loadError" class="browse-error" role="alert">
      <span i18n>Couldn't load blueprints. Scroll to try again.</span>
    </div>

    <div class="blueprint-grid">
      <ng-container *ngFor="let item of blueprintListItems">
        <article
          *ngIf="isReal(item.thumbnail)"
          class="blueprint-card bni-card bni-rivets"
        >
          <a class="bni-card__thumb" [routerLink]="['/blueprint', item.id]">
            <img [src]="item.thumbnail" [alt]="item.name" />
          </a>

          <div class="card-info">
            <a class="bni-card__title" [routerLink]="['/blueprint', item.id]">{{
              item.name
            }}</a>
            <div class="card-meta">
              <span i18n
                >by
                <a
                  class="card-owner"
                  [routerLink]="['/profile', item.ownerName]"
                  >{{ item.ownerName }}</a
                ></span
              >
              <span class="card-date">{{
                datepipe.transform(item.createdAt, "yyyy-MM-dd")
              }}</span>
            </div>
            <div class="card-badges">
              <span *ngIf="item.category" class="bni-chip bni-chip--cat">{{
                item.category
              }}</span>
              <span
                *ngIf="!item.category"
                class="bni-chip bni-chip--untagged"
                i18n
                >Untagged</span
              >
              <span *ngIf="item.gameVersion" class="bni-chip">{{
                item.gameVersion
              }}</span>
              <span *ngIf="item.modded" class="bni-chip bni-chip--modded" i18n
                >Modded</span
              >
            </div>
            <div class="card-social">
              <app-like-widget
                class="card-likes"
                [blueprintId]="item.id"
                [nbLikes]="item.nbLikes"
                [likedByMe]="item.likedByMe"
                [disabled]="!loggedIn"
              ></app-like-widget>
              <a
                class="card-comments bni-icon-link"
                [routerLink]="['/blueprint', item.id]"
                i18n-title
                title="View comments"
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M21 12c0 4-4 7-9 7-1 0-2-.1-2.9-.4L4 20l1.2-3.2C3.8 15.5 3 13.8 3 12c0-4 4-7 9-7s9 3 9 7z"
                  ></path>
                </svg>
                {{ item.commentCount }}
              </a>
              <a
                class="card-forks bni-icon-link"
                [routerLink]="['/blueprint', item.id]"
                i18n-title
                title="Fork count"
              >
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <circle cx="6" cy="5" r="2.6"></circle>
                  <circle cx="18" cy="5" r="2.6"></circle>
                  <circle cx="12" cy="19" r="2.6"></circle>
                  <path
                    d="M6 8v2c0 2 1.5 3 3.5 3h5c2 0 3.5-1 3.5-3V8M12 13v3"
                  ></path>
                </svg>
                {{ item.nbForks }}
              </a>
            </div>
          </div>
        </article>

        <div
          *ngIf="item.thumbnail === 'svg'"
          class="blueprint-card bni-card bni-skel"
          aria-hidden="true"
        >
          <div class="bni-card__thumb">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <path
                d="M7 3h10M7 21h10M8 3c0 4 8 5 8 9s-8 5-8 9M16 3c0 4-8 5-8 9s8 5 8 9"
              ></path>
            </svg>
          </div>
          <div class="card-info skel-info">
            <div class="bni-skel__bar"></div>
            <div class="bni-skel__bar bni-skel__bar--dim"></div>
            <div class="skel-chips">
              <div class="bni-skel__chip"></div>
              <div class="bni-skel__chip skel-chip--narrow"></div>
            </div>
          </div>
        </div>

        <div
          *ngIf="item.thumbnail === 'svg_nothing'"
          class="blueprint-card bni-card no-results-card"
        >
          <div class="bni-card__thumb no-results-thumb">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M6 6l12 12"></path>
            </svg>
          </div>
          <div class="card-info">
            <span class="bni-card__title">{{ item.name }}</span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
