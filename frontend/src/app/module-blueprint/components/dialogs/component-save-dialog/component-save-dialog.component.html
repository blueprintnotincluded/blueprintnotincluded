<form [formGroup]="saveBlueprintForm" (ngSubmit)="onSubmit()">
  <p-dialog
    #saveDialog
    [header]="dialogHeader"
    [(visible)]="visible"
    [modal]="true"
    [dismissableMask]="true"
    [closable]="true"
    [focusOnShow]="false"
    [maximizable]="false"
    [draggable]="false"
    [resizable]="false"
    styleClass="save-dialog"
    [style]="{ width: '34rem', maxWidth: '95vw' }"
  >
    <div class="save-form">
      <div class="save-field">
        <label for="save-name" i18n>Blueprint name</label>
        <input
          id="save-name"
          type="text"
          maxlength="60"
          formControlName="name"
          pInputText
        />
        <div
          *ngIf="f.name.invalid && (f.name.dirty || f.name.touched)"
          class="save-field-error"
        >
          <div *ngIf="f.name.errors?.['required']" i18n>
            Blueprint name is required.
          </div>
          <div *ngIf="f.name.errors?.['invalidChars']" i18n>
            Invalid characters in blueprint name
          </div>
          <div *ngIf="f.name.errors?.['tooLong']" i18n>
            Blueprint name is too long
          </div>
        </div>
      </div>

      <div class="save-field">
        <label for="save-description" i18n>Description (optional)</label>
        <textarea
          id="save-description"
          rows="3"
          formControlName="description"
          pTextarea
          maxlength="500"
        ></textarea>
      </div>

      <div class="save-row">
        <div class="save-field">
          <label for="save-category" i18n>Category</label>
          <p-select
            inputId="save-category"
            formControlName="category"
            [options]="categoryOptions"
            [showClear]="true"
            i18n-placeholder
            placeholder="Choose a category"
            optionLabel="label"
            optionValue="value"
            (onChange)="onCategoryChange()"
          ></p-select>
        </div>
        <div class="save-field" *ngIf="subcategoryOptions.length > 0">
          <label for="save-subcategory" i18n>Subcategory</label>
          <p-select
            inputId="save-subcategory"
            formControlName="subcategory"
            [options]="subcategoryOptions"
            [showClear]="true"
            i18n-placeholder
            placeholder="Optional"
            optionLabel="label"
            optionValue="value"
          ></p-select>
        </div>
      </div>

      <div class="save-detected">
        <div class="save-detected-caption" i18n>
          Auto-detected from blueprint content
        </div>
        <div class="save-detected-fields">
          <div class="save-field">
            <label for="save-game-version" i18n>Game version</label>
            <p-select
              inputId="save-game-version"
              formControlName="gameVersion"
              [options]="gameVersionOptions"
              placeholder=" "
              optionLabel="label"
              optionValue="value"
            ></p-select>
          </div>
          <label class="metadata-checkbox">
            <p-checkbox formControlName="modded" [binary]="true"></p-checkbox>
            <span i18n>Modded</span>
          </label>
        </div>
      </div>

      <div *ngIf="overwrite" class="save-field-error" i18n>
        You already have a blueprint with this name. Overwrite?
      </div>
      <div *ngIf="!authService.isLoggedIn()" class="save-field-error" i18n>
        You must be logged in to save a blueprint
      </div>
    </div>

    <ng-template pTemplate="footer">
      <!-- Already published: a single plain Update keeps the state -->
      <button
        *ngIf="!overwrite && isUpdate && !isDraft"
        type="button"
        pButton
        [label]="saveLabel"
        [icon]="icon"
        (click)="submit(null)"
        [disabled]="disabledSaveButton"
        class="save-action"
      ></button>
      <!-- New save or draft update: publish is the primary, fun path;
           keeping it as a draft stays one click away -->
      <ng-container *ngIf="!overwrite && (!isUpdate || isDraft)">
        <button
          type="button"
          pButton
          [label]="draftLabel"
          (click)="submit(isUpdate ? null : false)"
          [disabled]="disabledSaveButton"
          class="p-button-text save-action save-action--draft"
        ></button>
        <button
          type="button"
          pButton
          [label]="publishLabel"
          [icon]="icon || 'pi pi-send'"
          (click)="submit(true)"
          [disabled]="disabledSaveButton"
          class="save-action save-action--publish"
        ></button>
      </ng-container>
      <button
        *ngIf="overwrite"
        type="button"
        pButton
        icon="pi pi-times"
        (click)="doNotOverwrite()"
        i18n-label
        label="No"
        class="ui-button-danger"
      ></button>
      <button
        *ngIf="overwrite"
        type="button"
        pButton
        [icon]="working ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
        (click)="doOverwrite()"
        i18n-label
        label="Yes"
        [disabled]="disabledSaveButton"
      ></button>
    </ng-template>
  </p-dialog>
</form>
