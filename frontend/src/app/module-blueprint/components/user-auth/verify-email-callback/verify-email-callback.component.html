<div class="auth-page">
  <div class="auth-container">
    <a class="auth-brand" routerLink="/">
      <img
        src="assets/images/ui/manual/logo.png"
        alt="Blueprint Not Included"
        class="auth-logo"
      />
      <div class="auth-site-name">Blueprint Not Included</div>
    </a>
    <p-card header="Verify your email">
      <p class="verify-hint">
        Enter the verification code we sent to your email address.
      </p>

      <form (ngSubmit)="submit()" #verifyForm="ngForm">
        <div class="field">
          <label for="code">Verification code</label>
          <input
            pInputText
            id="code"
            type="text"
            [(ngModel)]="code"
            name="code"
            required
            autocomplete="one-time-code"
            inputmode="numeric"
            class="w-full"
          />
        </div>

        <div *ngIf="errorMessage" class="auth-error">
          {{ errorMessage }}
        </div>

        <div class="auth-actions">
          <button
            pButton
            type="submit"
            label="Verify email"
            icon="pi pi-check"
            [loading]="loading"
            [disabled]="!code"
            class="w-full"
          ></button>
        </div>
      </form>
    </p-card>
  </div>
</div>
