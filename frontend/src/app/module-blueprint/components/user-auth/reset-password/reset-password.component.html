<div class="auth-page">
  <p-card header="Set new password">
    <form
      (ngSubmit)="submit()"
      #resetForm="ngForm"
      *ngIf="!errorMessage || newPassword"
    >
      <div class="field">
        <label for="newPassword">New password</label>
        <p-password
          inputId="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          [toggleMask]="true"
          autocomplete="new-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <p-password
          inputId="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
      </div>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <div class="auth-actions">
        <button
          pButton
          type="submit"
          label="Set new password"
          icon="pi pi-check"
          [loading]="loading"
          class="w-full"
        ></button>
      </div>
    </form>

    <div *ngIf="errorMessage && !newPassword" class="token-error">
      <p>{{ errorMessage }}</p>
      <a routerLink="/login/forgot">Request a new reset link</a>
    </div>
  </p-card>
</div>
