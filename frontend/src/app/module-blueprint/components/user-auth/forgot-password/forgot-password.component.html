<div class="auth-page">
  <p-card header="Reset password">
    <ng-container *ngIf="!submitted; else done">
      <form (ngSubmit)="submit()" #forgotForm="ngForm">
        <div class="field">
          <label for="email">Email</label>
          <input
            pInputText
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
            class="w-full"
          />
        </div>

        <div class="auth-actions">
          <button
            pButton
            type="submit"
            label="Send reset link"
            icon="pi pi-envelope"
            [loading]="loading"
            class="w-full"
          ></button>
        </div>
      </form>
    </ng-container>

    <ng-template #done>
      <p class="confirmation-message">
        If that email has an account, you'll receive a reset link shortly.
      </p>
    </ng-template>

    <div class="auth-links">
      <a routerLink="/login">Back to login</a>
    </div>
  </p-card>
</div>
