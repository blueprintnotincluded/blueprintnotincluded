<div class="auth-page">
  <div class="auth-container">
    <a class="auth-brand" routerLink="/">
      <img
        src="assets/images/ui/manual/logo.png"
        alt="Blueprint Not Included"
        class="auth-logo"
      />
      <div class="auth-site-name">Blueprint Not Included</div>
    </a>
    <div class="local-auth-banner" *ngIf="authMode === 'local'">
      LOCAL AUTH MODE
    </div>
    <p-card header="Log in">
      <div
        class="dev-user-picker"
        *ngIf="authMode === 'local' && devUsers.length"
      >
        <div class="dev-user-picker-label">Sign in as…</div>
        <button
          pButton
          type="button"
          *ngFor="let devUser of devUsers"
          [label]="
            devUser.username + (devUser.role ? ' (' + devUser.role + ')' : '')
          "
          icon="pi pi-user"
          class="p-button-outlined w-full dev-user-button"
          [disabled]="loading"
          (click)="loginAsDevUser(devUser)"
        ></button>
        <hr class="dev-user-picker-divider" />
      </div>
      <form (ngSubmit)="submit()" #loginForm="ngForm">
        <div class="field">
          <label for="email">Email</label>
          <input
            pInputText
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
            class="w-full"
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <p-password
            inputId="password"
            [(ngModel)]="password"
            name="password"
            required
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            styleClass="w-full"
            inputStyleClass="w-full"
          ></p-password>
        </div>

        <div *ngIf="errorMessage" class="auth-error">
          {{ errorMessage }}
        </div>

        <div *ngIf="showLegacyHint" class="legacy-hint">
          <p>
            It looks like you have an existing account, but our login system has
            been upgraded. Click below to set a new password and regain access.
          </p>
          <button
            pButton
            type="button"
            label="Reset your password"
            icon="pi pi-envelope"
            class="p-button-outlined w-full"
            (click)="resetPassword()"
          ></button>
        </div>

        <div class="auth-actions">
          <button
            pButton
            type="submit"
            label="Log in"
            icon="pi pi-sign-in"
            [loading]="loading"
            class="w-full"
          ></button>
        </div>

        <div class="auth-links">
          <ng-container *ngIf="authMode !== 'local'">
            <a routerLink="/login/forgot">Forgot password?</a>
            <span class="separator">·</span>
            <a routerLink="/login/magic">Sign in with a code instead</a>
            <span class="separator">·</span>
          </ng-container>
          <a routerLink="/register">No account? Register</a>
        </div>
      </form>
    </p-card>
  </div>
</div>
