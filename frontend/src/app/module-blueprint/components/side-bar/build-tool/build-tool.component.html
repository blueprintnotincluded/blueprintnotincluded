<div #selectToolCard class="box-card ui-widget">
  <div class="box-card-title" i18n>Build Tool</div>
  <div *ngIf="databaseLoaded">
    <div
      class="ui-clickable-icon element-button-width"
      (click)="openBuildMenu()"
      style="margin-bottom: 5px"
    >
      <div class="building-panel-content">
        <img
          *ngIf="!currentItem.isElement"
          src="{{ currentItem.thumbUrl }}"
          height="40px"
        />
        <app-element-icon
          *ngIf="currentItem.isElement"
          [element]="currentItemToBuild.buildableElements[0]"
          [width]="'40px'"
          [height]="'40px'"
        >
        </app-element-icon>
        <div class="left"></div>
        <div>
          <div>{{ currentItem.name }}</div>
          <div class="build-dlc-chips" *ngIf="dlcLabels(currentItem).length">
            <span
              class="bni-chip bni-chip--dlc build-dlc-chip"
              *ngFor="let label of dlcLabels(currentItem)"
              >{{ label }}</span
            >
          </div>
        </div>
        <div class="right"></div>
      </div>
    </div>

    <!-- The only way to turn the brush on a touch screen; the key hint in the
         label follows the user's binding. Hidden for an item with a single
         orientation, which has nothing to turn to. -->
    <button
      *ngIf="currentItem.orientations.length > 1"
      pButton
      type="button"
      class="ui-button rotate-button"
      icon="pi pi-refresh"
      [label]="rotateLabel"
      (click)="rotate()"
      i18n-pTooltip
      pTooltip="Turn the item to its next orientation"
      tooltipEvent="both"
    ></button>
    <div
      *ngIf="!currentItemToBuild.buildCandidateResult.canBuild"
      class="error-red"
    >
      {{ currentItemToBuild.buildCandidateResult.cantBuildReason }}
    </div>

    <app-buildable-element-picker
      [currentElement]="currentItemToBuild.buildableElements"
      [buildableElementsArray]="currentItem.buildableElementsArray"
      [isGasLiquid]="isGasLiquid"
      (changeElement)="changeElement($event)"
    >
    </app-buildable-element-picker>

    <div
      *ngIf="(currentItem?.secondaryMaterialCosts?.length || 0) > 0"
      class="secondary-costs"
    >
      <fieldset class="ui-fieldset ui-widget ui-widget-content ui-corner-all">
        <legend
          class="ui-fieldset-legend ui-corner-all ui-state-default ui-unselectable-text"
        >
          <span class="ui-fieldset-legend-text" i18n>Additional Costs</span>
        </legend>
        <div class="ui-fieldset-content-wrapper">
          <div class="ui-fieldset-content">
            <div
              *ngFor="let cost of currentItem.secondaryMaterialCosts"
              class="secondary-cost-item"
            >
              <div class="element-panel-content non-selectable">
                <app-element-icon
                  *ngIf="cost.element.iconUrl"
                  [element]="cost.element"
                  [width]="'40px'"
                  [height]="'40px'"
                ></app-element-icon>
                <div
                  *ngIf="!cost.element.iconUrl"
                  class="generic-icon"
                  [style.background-color]="
                    '#' + cost.element.color.toString(16).padStart(6, '0')
                  "
                ></div>
                <div class="left"></div>
                <div>{{ cost.element.name }}</div>
                <div class="right"></div>
              </div>
            </div>
          </div>
        </div>
      </fieldset>
    </div>

    <app-temperature-picker
      [blueprintItem]="currentItemToBuild"
      [temperatureWarning]="false"
    >
    </app-temperature-picker>

    <app-ui-screen-container [blueprintItem]="currentItemToBuild">
    </app-ui-screen-container>
  </div>
</div>
