<div>
  <input
    class="float-input"
    type="text"
    size="30"
    i18n-placeholder
    placeholder="Search"
    [(ngModel)]="filterName"
    (ngModelChange)="filterNameSubject.next($event)"
    pInputText
  />
</div>

<!-- PrimeNG 20's Checkbox has no `label` input (only ariaLabel/ariaLabelledBy),
     so the `label="Gas"` these carried through the v20 upgrade rendered nothing
     and left three bare boxes. The labels are real <label for> elements now,
     which also restores click-the-word-to-toggle. -->
<div class="tag-filter" *ngIf="!isForcedTag && !isStateFiltered">
  <span class="tag-filter-option">
    <p-checkbox
      name="groupTag"
      (onChange)="tagChanged($event)"
      value="Gas"
      [(ngModel)]="selectedTags"
      inputId="Gas"
    ></p-checkbox>
    <label for="Gas" i18n>Gas</label>
  </span>
  <span class="tag-filter-option">
    <p-checkbox
      name="groupTag"
      (onChange)="tagChanged($event)"
      value="Liquid"
      [(ngModel)]="selectedTags"
      inputId="Liquid"
    ></p-checkbox>
    <label for="Liquid" i18n>Liquid</label>
  </span>
  <!-- Off by default: solids are normally drawn as tile buildings, and this
       list exists for gas/liquid annotations. Ticking it reaches the natural
       terrain materials — Neutronium above all, the indestructible row every
       geyser sits on. -->
  <span class="tag-filter-option">
    <p-checkbox
      name="groupTag"
      (onChange)="tagChanged($event)"
      value="Solid"
      [(ngModel)]="selectedTags"
      inputId="Solid"
    ></p-checkbox>
    <label for="Solid" i18n>Solid</label>
  </span>
</div>

<div class="state-filter" *ngIf="showStateSegments">
  <button
    type="button"
    class="state-filter-button"
    [class.selected]="selectedState === null"
    [attr.aria-pressed]="selectedState === null"
    (click)="selectState(null)"
    i18n
  >
    All
  </button>
  <button
    type="button"
    class="state-filter-button"
    *ngFor="let s of states"
    [class.selected]="selectedState === s"
    [attr.aria-pressed]="selectedState === s"
    (click)="selectState(s)"
  >
    {{ stateLabel(s) }}
  </button>
</div>

<div class="element-list" [class.compact]="isStateFiltered">
  <div
    *ngFor="let element of elements"
    class="ui-clickable-icon element-button"
    (click)="selectElement(element)"
    style="margin-bottom: 5px"
  >
    <div class="element-panel-content">
      <app-element-icon
        [element]="element"
        [width]="'25px'"
        [height]="'25px'"
      ></app-element-icon>
      <div class="element-panel-text">{{ element.name }}</div>
    </div>
  </div>
  <p class="element-list-empty" *ngIf="elements.length === 0" i18n>
    No elements match this search.
  </p>
</div>
