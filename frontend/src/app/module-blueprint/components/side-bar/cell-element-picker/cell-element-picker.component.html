<div>
  <input
    class="float-input"
    type="text"
    size="30"
    i18n-placeholder
    placeholder="Search"
    [(ngModel)]="filterName"
    (ngModelChange)="filterNameSubject.next($event)"
    pInputText
  />
</div>

<div *ngIf="!isForcedTag && !isStateFiltered">
  <p-checkbox
    name="groupTag"
    (onChange)="tagChanged($event)"
    value="Gas"
    i18n-label
    label="Gas"
    [(ngModel)]="selectedTags"
    inputId="Gas"
  ></p-checkbox>
  <span class="second-checkbox"
    ><p-checkbox
      name="groupTag"
      (onChange)="tagChanged($event)"
      value="Liquid"
      i18n-label
      label="Liquid"
      [(ngModel)]="selectedTags"
      inputId="Liquid"
    ></p-checkbox
  ></span>
  <!-- Off by default: solids are normally drawn as tile buildings, and this
       list exists for gas/liquid annotations. Ticking it reaches the natural
       terrain materials — Neutronium above all, the indestructible row every
       geyser sits on. -->
  <span class="second-checkbox"
    ><p-checkbox
      name="groupTag"
      (onChange)="tagChanged($event)"
      value="Solid"
      i18n-label
      label="Solid"
      [(ngModel)]="selectedTags"
      inputId="Solid"
    ></p-checkbox
  ></span>
</div>

<div class="state-filter" *ngIf="isStateFiltered">
  <button
    type="button"
    class="state-filter-button"
    [class.selected]="selectedState === null"
    [attr.aria-pressed]="selectedState === null"
    (click)="selectState(null)"
    i18n
  >
    All
  </button>
  <button
    type="button"
    class="state-filter-button"
    *ngFor="let s of states"
    [class.selected]="selectedState === s"
    [attr.aria-pressed]="selectedState === s"
    (click)="selectState(s)"
  >
    {{ stateLabel(s) }}
  </button>
</div>

<div class="element-list" [class.compact]="isStateFiltered">
  <div
    *ngFor="let element of elements"
    class="ui-clickable-icon element-button"
    (click)="selectElement(element)"
    style="margin-bottom: 5px"
  >
    <div class="element-panel-content">
      <app-element-icon
        [element]="element"
        [width]="'25px'"
        [height]="'25px'"
      ></app-element-icon>
      <div class="element-panel-text">{{ element.name }}</div>
    </div>
  </div>
  <p class="element-list-empty" *ngIf="elements.length === 0" i18n>
    No elements match this search.
  </p>
</div>
