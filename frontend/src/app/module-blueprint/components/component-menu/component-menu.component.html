<p-menubar #menu [model]="menuItems">
  <div class="menu-line">
    <div *ngIf="authService.isLoggedIn()">
      <p-menu #userMenu [model]="userMenuItems" [popup]="true"></p-menu>
      <button
        pButton
        type="button"
        icon="pi pi-user"
        [label]="authService.getUserDetails()!.username"
        (click)="userMenu.toggle($event)"
      ></button>
    </div>

    <button
      *ngIf="!authService.isLoggedIn()"
      pButton
      icon="pi pi-sign-in"
      i18n-label
      label="Login"
      (click)="login()"
    ></button>
  </div>
</p-menubar>

<input
  type="file"
  id="fileChooser"
  accept=".yaml"
  style="display: none"
  (change)="templateUpload($event)"
/>
<input
  type="file"
  id="fileChooserJson"
  accept=".json,.blueprint"
  style="display: none"
  (change)="templateUploadJson($event)"
/>
<input
  type="file"
  id="fileChooserBson"
  accept=".blueprint"
  style="display: none"
  (change)="templateUploadBson($event)"
/>
